<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>VecAnima 向量播放器</title>
<style>body{background:#111820;color:#e5edf4;font:16px system-ui;margin:24px}button,input,select{margin:6px}button{padding:8px}.panels{display:flex;gap:16px;flex-wrap:wrap}.panel{flex:1;min-width:300px}video,#original,.stage{width:100%;background:#000}.viewport{overflow:auto;max-height:65vh}.stage{position:relative;background:repeating-conic-gradient(#e0e0e0 0% 25%,#fafafa 0% 50%) 50%/20px 20px}#original{display:block}#mesh,#svg{display:block;width:100%}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#scrub{width:40%}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#192631}#error{color:#ffb8a9}[hidden]{display:none!important}</style>
<h1>VecAnima · 原生向量播放器</h1><p>__MODEL_DESCRIPTION__</p><p id="error" role="alert"></p>
<div class="panels"><div class="panel"><div class="viewport"><img id="original" alt="工作解析度原圖"></div><p>原圖 · 同步逐幀</p></div><div class="panel"><div class="viewport"><div class="stage" id="stage"><canvas id="mesh"></canvas><img id="overlay" alt="向量筆觸"><img id="svg" alt="匯出 SVG"></div></div><label>顯示<select id="mode"><option value="native">原生網格／筆觸</option><option value="svg">SVG 近似</option></select></label><label><input type="checkbox" id="showStrokes" checked>顯示筆觸</label><label><input type="checkbox" id="showFills" checked>顯示色塊</label></div></div>
<p><button id="play">播放向量</button><button id="prev">上一幀</button><button id="next">下一幀</button><span id="label"></span><input id="scrub" type="range" min="0" step="1"><label>縮放<input id="zoom" type="range" min="1" max="4" step=".25" value="1"></label></p>
<details><summary>影音預覽與同步</summary>__VIDEO__</details><details open><summary>物件檢視</summary><p>點選畫面，檢查區域、三角形與最近筆觸。</p><pre id="inspect">尚未選取</pre></details>
<details><summary>調整參數後重新處理</summary><label>填色<select id="fill"><option value="mesh">網格漸層</option><option value="flat">純色</option></select></label><label>網格誤差<input id="meshError" type="number" min="1" max="255" value="8"></label><label>最大線寬<input id="strokeWidth" type="number" min="2" max="128" value="16"></label><button id="command">產生 CLI 指令</button><pre id="rerun"></pre></details>
<script>
'use strict';
const frames=__TIMELINE__,duration=__DURATION__,$=id=>document.getElementById(id),v=$('video'),slider=$('scrub'),play=$('play'),canvas=$('mesh');
let current=0,playing=false,manual=false,epoch=0,project,geometry,gpuData,serial=0,controller;const cache=new Map();slider.max=frames.length-1;
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:true});let program,buffer,position,color;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
if(gl)try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;attribute vec3 c;varying vec3 rgb;void main(){gl_Position=vec4(p,0.0,1.0);rgb=c;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision highp float;varying vec3 rgb;float s(float v){return v<=0.0031308?12.92*max(v,0.0):1.055*pow(v,1.0/2.4)-0.055;}void main(){gl_FragColor=vec4(s(rgb.r),s(rgb.g),s(rgb.b),1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);buffer=gl.createBuffer();position=gl.getAttribLocation(program,'p');color=gl.getAttribLocation(program,'c');}catch(e){$('error').textContent=e.message;program=null;}
function draw(){if(!geometry)return;const asset=project.assets[frames[current].asset];if($('showStrokes').checked && $('overlay').getAttribute('src')!==asset.strokes_svg)$('overlay').src=asset.strokes_svg;const native=$('mode').value==='native'&&geometry.mesh&&program;const fills=$('showFills').checked;canvas.hidden=!native||!fills;$('overlay').hidden=!$('showStrokes').checked;$('svg').hidden=!!native||!fills;$('stage').style.aspectRatio=geometry.width+'/'+geometry.height;if(!native&&fills&&$('svg').getAttribute('src')!==asset.fills_svg)$('svg').src=asset.fills_svg;if(!native){if(geometry.mesh&&!program)$('error').textContent='WebGL 無法使用，顯示 SVG 近似。';return;}const zoom=Number($('zoom').value),ratio=window.devicePixelRatio||1,max=gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);canvas.width=Math.min(max,Math.round(geometry.width*zoom*ratio));canvas.height=Math.min(max,Math.round(geometry.height*zoom*ratio));gl.viewport(0,0,canvas.width,canvas.height);let data=gpuData;if(!data){const m=geometry.mesh;data=new Float32Array(m.geometry.triangles.length*15);let offset=0;m.geometry.triangles.forEach((t,i)=>t.forEach((index,j)=>{const p=m.geometry.points[index],c=m.colors_linear[i][j];data.set([p[0]/geometry.width*2-1,1-p[1]/geometry.height*2,c[0],c[1],c[2]],offset);offset+=5;}));}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STREAM_DRAW);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(color);gl.vertexAttribPointer(color,3,gl.FLOAT,false,20,8);gl.drawArrays(gl.TRIANGLES,0,data.length/5);}
async function show(i){current=Math.max(0,Math.min(frames.length-1,i));const f=frames[current],ticket=++serial;slider.value=current;$('label').textContent=`${current+1}/${frames.length} · ${f.time.toFixed(3)}s`;$('original').src=f.original;if(!project)return;const asset=project.assets[f.asset];try{if(controller)controller.abort();controller=new AbortController();let data=cache.get(asset.id);if(!data){if(asset.mesh_buffer){const response=await fetch(asset.mesh_buffer,{signal:controller.signal});if(!response.ok)throw Error(`網格載入失敗 ${response.status}`);const bytes=await response.arrayBuffer();if(bytes.byteLength%60)throw Error('網格 buffer 長度錯誤');data={width:project.width,height:project.height,mesh:true,strokes:[],gpu:new Float32Array(bytes)};}else{const response=await fetch(asset.geometry,{signal:controller.signal});if(!response.ok)throw Error(`影格載入失敗 ${response.status}`);data=await response.json();if(data.version!==3)throw Error('不支援的影格格式');}cache.set(asset.id,data);while(cache.size>3)cache.delete(cache.keys().next().value);}if(ticket!==serial)return;geometry=data;gpuData=data.gpu;draw();}catch(e){if(e.name!=='AbortError')$('error').textContent=e.message;}}
function pause(){playing=false;play.textContent='播放向量';if(v)v.pause();}function seek(i){pause();manual=true;show(i);if(v)v.currentTime=frames[current].time+.000001;}function sync(t){let lo=0,hi=frames.length;while(lo<hi){const m=(lo+hi)>>1;if(frames[m].time<=t+.000001)lo=m+1;else hi=m;}const i=Math.max(0,lo-1);if(i!==current)show(i);}
play.onclick=()=>{if(playing){pause();return;}manual=true;if(v)v.pause();if(current===frames.length-1)show(0);epoch=performance.now()/1000-frames[current].time;playing=true;play.textContent='暫停向量';};$('prev').onclick=()=>seek(current-1);$('next').onclick=()=>seek(current+1);slider.oninput=()=>seek(Number(slider.value));$('mode').onchange=draw;$('showStrokes').onchange=draw;$('showFills').onchange=draw;$('zoom').oninput=e=>{const views=[...document.querySelectorAll('.viewport')],center=[(views[0].scrollLeft+views[0].clientWidth/2)/views[0].scrollWidth,(views[0].scrollTop+views[0].clientHeight/2)/views[0].scrollHeight];$('stage').style.width=(100*e.target.value)+'%';$('original').style.width=(100*e.target.value)+'%';draw();views.forEach(p=>{p.scrollLeft=center[0]*p.scrollWidth-p.clientWidth/2;p.scrollTop=center[1]*p.scrollHeight-p.clientHeight/2;});};if(v){v.addEventListener('play',()=>{manual=false;playing=false;play.textContent='播放向量';});v.addEventListener('pointerdown',()=>manual=false);v.addEventListener('seeked',()=>{if(!manual)sync(v.currentTime);});}
$('stage').onclick=async e=>{if(!geometry)return;const selected=current;if(geometry.gpu){try{const response=await fetch(project.assets[frames[current].asset].geometry);const full=await response.json();if(selected!==current)return;geometry=full;}catch(error){$('inspect').textContent=error.message;return;}}const r=$('stage').getBoundingClientRect(),p=[(e.clientX-r.left)/r.width*geometry.width,(e.clientY-r.top)/r.height*geometry.height],info={frame:current+1,point:p.map(v=>+v.toFixed(2))};if(geometry.mesh){const m=geometry.mesh,cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);const i=m.geometry.triangles.findIndex(t=>{const[a,b,c]=t.map(v=>m.geometry.points[v]);return cross(a,b,p)>=0&&cross(b,c,p)>=0&&cross(c,a,p)>=0;});info.triangle=i;info.region=m.region_labels[i];info.mesh_error=m.max_channel_error;info.unmet_pixels=m.unmet_pixels;}let distance=Infinity,nearest,node;for(const s of geometry.strokes)for(const q of (s.nodes||s.samples)){const d=Math.hypot(p[0]-q.center[0],p[1]-q.center[1]);if(d<distance){distance=d;nearest=s;node=q;}}if(nearest&&distance<16){info.stroke={id:nearest.id,color:nearest.fill,samples:nearest.samples.length,closed:nearest.closed,node:{center:node.center,left_width:node.left,right_width:node.right,total_width:node.left+node.right,color_linear:node.color_linear,confidence:node.confidence}};const path=frames[current].tracking;if(path)try{const record=await(await fetch(path)).json();info.track=record.associations.find(a=>a.stroke===nearest.id);info.shot=record.shot;}catch(e){info.error=e.message;}}$('inspect').textContent=JSON.stringify(info,null,2);};
const quote=value=>"'"+String(value).replaceAll("'","''")+"'";$('command').onclick=async()=>{const t=await(await fetch('timeline.json')).json(),kind=t.input_kind||'vectorize',command=kind==='image'?'image':kind==='sequence'?'sequence':'vectorize';let args=`./scripts/cargo.ps1 run --release --locked --offline -- ${command} ${quote(t.source)} --out ${quote('output/rerun-'+Date.now())}`;if(command==='vectorize')args+=` --start ${t.requested_start} --duration ${t.requested_duration} --width ${project.width}`;args+=` --fill-model ${$('fill').value} --mesh-error ${Number($('meshError').value)} --stroke-max-width ${Number($('strokeWidth').value)}`;const s=project.settings;if(s.strokes?.line_model)args+=` --line-model ${quote(s.strokes.line_model)}`;if(s.strokes?.fill_edge_padding!==undefined)args+=` --fill-edge-padding ${s.strokes.fill_edge_padding}`;if(s.strokes?.stroke_min_aspect!==undefined)args+=` --stroke-min-aspect ${s.strokes.stroke_min_aspect}`;if(s.temporal?.temporal)args+=' --temporal';$('rerun').textContent=args;};
async function init(){try{const response=await fetch('project.json');if(!response.ok)throw Error('無法載入 project.json');project=await response.json();if(project.format!=='vecanima'||project.format_version!==3)throw Error('不支援的專案格式');$('fill').value=project.settings.fill.fill_model.toLowerCase();$('meshError').value=project.settings.fill.mesh_error;$('strokeWidth').value=project.settings.strokes.stroke_max_width;await show(0);}catch(e){$('error').textContent=e.message+'。請透過本機 HTTP 伺服器開啟。';}}function tick(){if(playing){const t=performance.now()/1000-epoch;if(t>=duration){sync(duration);pause();}else sync(t);}else if(v&&!v.paused)sync(v.currentTime);requestAnimationFrame(tick);}init();tick();
</script></html>
