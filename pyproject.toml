[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "vecanima"
version = "0.1.0"
description = "Stroke and region separated cartoon vectorization experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "opencv-contrib-python-headless>=4.10,<5",
    "resvg-py>=0.2,<1",
    "scikit-image>=0.25,<1",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "editables>=0.6",
    "hatchling>=1.32.4",
    "pytest>=8,<10",
]

[project.scripts]
vecanima-reference = "vecanima.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
